<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block code %}Error{% endblock %} — {{ settings.site_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 700; margin-bottom: 1rem; }
    p  { color: #94a3b8; font-size: 1rem; max-width: 400px; margin: 0 auto 2rem; line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div>
    <div class="error-code">{% block code %}{% endblock %}</div>
    <h1>{% block title %}Error{% endblock %}</h1>
    <p>{% block message %}An unexpected error occurred.{% endblock %}</p>
    <a href="{{ url_for('main.index') }}" class="btn">← Go Back Home</a>
  </div>
</body>
</html>
